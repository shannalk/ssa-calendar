name: Update SSA Calendar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update calendar
        run: python update_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "SSA Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || git commit -m "Update SSA calendar"
          git push
